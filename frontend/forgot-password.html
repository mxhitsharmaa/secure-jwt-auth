<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password</title>

    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >
</head>

<body>

    <main class="auth-container">

        <h1>Forgot Password</h1>

        <p>Enter your email address.</p>

        <form id="forgotForm">

            <input
                type="email"
                id="email"
                placeholder="Email address"
                autocomplete="email"
                required
            >

            <button
                type="submit"
                id="forgotBtn"
            >
                Send OTP
            </button>

            <p id="message"></p>

            <button
                type="button"
                id="resendBtn"
                hidden
                disabled
            >
                Resend OTP in 60s
            </button>

        </form>

        <p>
            <a href="login.html">
                Back to Login
            </a>
        </p>

    </main>

    <script src="assets/js/api.js"></script>

    <script>

        const form =
            document.getElementById(
                'forgotForm'
            );

        const button =
            document.getElementById(
                'forgotBtn'
            );

        const resendBtn =
            document.getElementById(
                'resendBtn'
            );

        const message =
            document.getElementById(
                'message'
            );

        const emailInput =
            document.getElementById(
                'email'
            );

        let countdownTimer = null;

        /* Start Countdown */

        function startCountdown() {

            let seconds = 60;

            resendBtn.hidden = false;
            resendBtn.disabled = true;

            resendBtn.textContent =
                `Resend OTP in ${seconds}s`;

            if (countdownTimer !== null) {

                clearInterval(
                    countdownTimer
                );
            }

            countdownTimer =
                setInterval(
                    function () {

                        seconds--;

                        if (seconds <= 0) {

                            clearInterval(
                                countdownTimer
                            );

                            countdownTimer =
                                null;

                            resendBtn.disabled =
                                false;

                            resendBtn.textContent =
                                'Resend OTP';

                            return;
                        }

                        resendBtn.textContent =
                            `Resend OTP in ${seconds}s`;

                    },
                    1000
                );
        }

        /* Send OTP */

        async function sendForgotPasswordOtp(
            redirectAfterSuccess = false
        ) {

            const email =
                emailInput.value.trim();

            if (!email) {

                message.textContent =
                    'Enter your email address.';

                return;
            }

            button.disabled = true;

            resendBtn.disabled = true;

            message.textContent =
                'Sending OTP...';

            try {

                const response =
                    await apiRequest(
                        '/auth/forgot-password.php',
                        {
                            method: 'POST',
                            body: {
                                email
                            }
                        }
                    );

                sessionStorage.setItem(
                    'reset_email',
                    email
                );

                message.textContent =
                    response.message;

                startCountdown();

                /* Open reset page */

                if (
                    redirectAfterSuccess
                ) {

                    setTimeout(
                        function () {

                            window.location.replace(
                                'reset-password.html'
                            );

                        },
                        500
                    );

                    return;
                }

                button.disabled = false;

            } catch (error) {

                message.textContent =
                    error.message ||
                    'Unable to send OTP.';

                button.disabled = false;

                resendBtn.disabled = true;
            }
        }

        /* Continue */

        form.addEventListener(
            'submit',
            async function (event) {

                event.preventDefault();

                await sendForgotPasswordOtp(
                    true
                );
            }
        );

        /* Resend OTP */

        resendBtn.addEventListener(
            'click',
            async function () {

                await sendForgotPasswordOtp(
                    false
                );
            }
        );

    </script>

</body>

</html>
