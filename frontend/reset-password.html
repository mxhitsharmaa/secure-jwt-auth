<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password</title>

    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >
</head>

<body>

    <main class="auth-container">

        <h1>Reset Password</h1>

        <p>Enter the OTP sent to your email.</p>

        <form id="resetForm">

            <input
                type="text"
                id="otp"
                placeholder="Enter 6-digit OTP"
                inputmode="numeric"
                maxlength="6"
                pattern="[0-9]{6}"
                autocomplete="one-time-code"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="New password"
                autocomplete="new-password"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                autocomplete="new-password"
                required
            >

            <button
                type="submit"
                id="resetBtn"
            >
                Reset Password
            </button>

            <p id="message"></p>

        </form>

        <p>
            <a href="login.html">
                Back to Login
            </a>
        </p>

    </main>

    <script src="assets/js/api.js"></script>

    <script>

        const form =
            document.getElementById(
                'resetForm'
            );

        const button =
            document.getElementById(
                'resetBtn'
            );

        const message =
            document.getElementById(
                'message'
            );

        const otpInput =
            document.getElementById(
                'otp'
            );

        const passwordInput =
            document.getElementById(
                'password'
            );

        const confirmPasswordInput =
            document.getElementById(
                'confirmPassword'
            );

        const email =
            sessionStorage.getItem(
                'reset_email'
            );

        /* Check email */

        if (!email) {

            window.location.replace(
                'forgot-password.html'
            );

        }

        /* Allow digits only */

        otpInput.addEventListener(
            'input',
            function () {

                this.value =
                    this.value
                        .replace(/\D/g, '')
                        .slice(0, 6);

            }
        );

        /* Reset Password */

        form.addEventListener(
            'submit',
            async function (event) {

                event.preventDefault();

                const otp =
                    otpInput.value.trim();

                const password =
                    passwordInput.value;

                const confirmPassword =
                    confirmPasswordInput.value;

                /* Validate OTP */

                if (
                    !/^\d{6}$/.test(otp)
                ) {

                    message.textContent =
                        'Enter a valid 6-digit OTP.';

                    otpInput.focus();

                    return;
                }

                /* Validate password */

                if (
                    password.length < 8 ||
                    password.length > 72
                ) {

                    message.textContent =
                        'Password must be 8 to 72 characters.';

                    passwordInput.focus();

                    return;
                }

                /* Confirm password */

                if (
                    password !==
                    confirmPassword
                ) {

                    message.textContent =
                        'Passwords do not match.';

                    confirmPasswordInput.focus();

                    return;
                }

                button.disabled = true;

                message.textContent =
                    'Verifying OTP...';

                try {

                    /* Verify OTP */

                    const verifyResponse =
                        await apiRequest(
                            '/otp/verify-password-reset.php',
                            {
                                method: 'POST',
                                body: {
                                    email,
                                    otp
                                }
                            }
                        );

                    const resetToken =
                        verifyResponse
                            ?.data
                            ?.reset_token;

                    if (!resetToken) {

                        throw new Error(
                            'Password reset token was not received.'
                        );
                    }

                    /* Reset password */

                    message.textContent =
                        'Updating password...';

                    await apiRequest(
                        '/auth/reset-password.php',
                        {
                            method: 'POST',
                            body: {
                                token:
                                    resetToken,
                                new_password:
                                    password
                            }
                        }
                    );

                    /* Remove reset data */

                    sessionStorage.removeItem(
                        'reset_email'
                    );

                    message.textContent =
                        'Password reset successfully.';

                    /* Login */

                    setTimeout(
                        function () {

                            window.location.replace(
                                'login.html'
                            );

                        },
                        1000
                    );

                } catch (error) {

                    message.textContent =
                        error.message ||
                        'Unable to reset password.';

                    button.disabled = false;

                    otpInput.focus();
                }

            }
        );

    </script>

</body>

</html>
